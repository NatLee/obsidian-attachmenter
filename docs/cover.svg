<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <!-- Source for docs/cover.png. Fonts: Fraunces (72pt) 600, Source Sans 3 400/600, JetBrains Mono 500. -->
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#17202C" fill-opacity="0.09"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1280" height="640" rx="28"/>
    </clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <!-- icons, drawn at the origin -->
    <path id="folder" d="M0 2.5 Q0 1 1.5 1 H7 L9 3 H18.5 Q20 3 20 4.5 V14.5 Q20 16 18.5 16 H1.5 Q0 16 0 14.5 Z"/>
    <path id="doc" d="M1.5 0 H10 L16 6 V18.5 Q16 20 14.5 20 H1.5 Q0 20 0 18.5 V1.5 Q0 0 1.5 0 Z"/>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="640" fill="#F3F5F8"/>
    <rect width="1280" height="640" fill="url(#dots)"/>

    <!-- Left: name and promise -->
    <text x="88" y="170" font-family="JetBrains Mono" font-weight="500" font-size="17" letter-spacing="3" fill="#5A6577">OBSIDIAN PLUGIN</text>
    <text x="84" y="262" font-family="Fraunces 72pt, Fraunces 72pt SemiBold, Fraunces" font-weight="600" font-size="82" fill="#17202C">Attachmenter</text>
    <text x="88" y="324" font-family="Source Sans 3" font-weight="600" font-size="34" fill="#17202C">One attachment folder per note.</text>
    <text font-family="Source Sans 3" font-weight="400" font-size="22" fill="#5A6577">
      <tspan x="88" y="374">Pasted images, downloaded images and renamed</tspan>
      <tspan x="88" y="404">notes all land in the same place.</tspan>
    </text>

    <g font-family="JetBrains Mono" font-weight="500" font-size="16" fill="#17202C">
      <rect x="88" y="452" width="76" height="36" rx="18" fill="#FFFFFF" stroke="#A9B3C1"/>
      <text x="126" y="476" text-anchor="middle">paste</text>
      <rect x="174" y="452" width="106" height="36" rx="18" fill="#FFFFFF" stroke="#A9B3C1"/>
      <text x="227" y="476" text-anchor="middle">download</text>
      <rect x="290" y="452" width="86" height="36" rx="18" fill="#FFFFFF" stroke="#A9B3C1"/>
      <text x="333" y="476" text-anchor="middle">rename</text>
      <rect x="386" y="452" width="164" height="36" rx="18" fill="#FFFFFF" stroke="#A9B3C1"/>
      <text x="468" y="476" text-anchor="middle">check &amp; repair</text>
    </g>

    <!-- Right: a file explorer showing the result -->
    <rect x="690" y="112" width="540" height="444" rx="18" fill="#17202C" fill-opacity="0.10" filter="url(#soft)"/>
    <rect x="680" y="96" width="540" height="444" rx="16" fill="#FFFFFF" stroke="#DCE1E8"/>
    <text x="708" y="130" font-family="JetBrains Mono" font-weight="500" font-size="13" letter-spacing="2" fill="#5A6577">FILES</text>
    <line x1="680" y1="148" x2="1220" y2="148" stroke="#DCE1E8"/>

    <!-- indent guides -->
    <line x1="742" y1="200" x2="742" y2="522" stroke="#DCE1E8" stroke-width="1.5"/>
    <line x1="774" y1="296" x2="774" y2="378" stroke="#DCE1E8" stroke-width="1.5"/>

    <!-- Notes/ -->
    <path d="M707 179 L712 184 L717 179" fill="none" stroke="#5A6577" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <use href="#folder" x="728" y="173" fill="#EEF1F5" stroke="#5A6577" stroke-width="1.5"/>
    <text x="760" y="189" font-family="Source Sans 3" font-weight="600" font-size="20" fill="#17202C">Notes</text>

    <!-- Project A (expanded, highlighted) -->
    <rect x="696" y="208" width="508" height="44" rx="8" fill="#EAF0FB"/>
    <rect x="696" y="208" width="4" height="44" rx="2" fill="#3556A6"/>
    <use href="#doc" x="756" y="220" fill="#FFFFFF" stroke="#3556A6" stroke-width="1.5"/>
    <path d="M766 220 V226 H772" fill="none" stroke="#3556A6" stroke-width="1.5"/>
    <text x="784" y="237" font-family="Source Sans 3" font-weight="600" font-size="20" fill="#3556A6">Project A</text>
    <rect x="1166" y="217" width="26" height="26" rx="6" fill="#FFFFFF" stroke="#A9B3C1"/>
    <path d="M1174 227 L1179 232 L1184 227" fill="none" stroke="#17202C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Project A_Attachments -->
    <use href="#folder" x="756" y="270" fill="#FBF1E1" stroke="#9C6415" stroke-width="1.5"/>
    <text x="786" y="285" font-family="Source Sans 3" font-weight="600" font-size="20" fill="#9C6415">Project A_Attachments</text>

    <!-- images inside -->
    <g font-family="JetBrains Mono" font-weight="500">
      <rect x="788" y="314" width="18" height="14" rx="2.5" fill="#FFFFFF" stroke="#5A6577" stroke-width="1.4"/>
      <path d="M791 325 L795 320 L798 323 L800 321 L803 325 Z" fill="#5A6577"/>
      <text x="816" y="326" font-size="14" fill="#17202C">Project A-20261103142530123.png</text>
      <rect x="1128" y="309" width="68" height="22" rx="11" fill="#FBF1E1" stroke="#9C6415"/>
      <text x="1162" y="324" font-size="12" fill="#9C6415" text-anchor="middle">pasted</text>

      <rect x="788" y="354" width="18" height="14" rx="2.5" fill="#FFFFFF" stroke="#5A6577" stroke-width="1.4"/>
      <path d="M791 365 L795 360 L798 363 L800 361 L803 365 Z" fill="#5A6577"/>
      <text x="816" y="366" font-size="14" fill="#17202C">Project A-20261103142630123.jpg</text>
      <rect x="1104" y="349" width="92" height="22" rx="11" fill="#E3F3F1" stroke="#1B7A72"/>
      <text x="1150" y="364" font-size="12" fill="#1B7A72" text-anchor="middle">downloaded</text>
    </g>

    <!-- Ideas (has remote images: globe hint) -->
    <use href="#doc" x="756" y="398" fill="#FFFFFF" stroke="#3556A6" stroke-width="1.5"/>
    <path d="M766 398 V404 H772" fill="none" stroke="#3556A6" stroke-width="1.5"/>
    <text x="784" y="415" font-family="Source Sans 3" font-weight="400" font-size="20" fill="#17202C">Ideas</text>
    <rect x="1166" y="395" width="26" height="26" rx="6" fill="#FFFFFF" stroke="#A9B3C1"/>
    <g fill="none" stroke="#1B7A72" stroke-width="1.5">
      <circle cx="1179" cy="408" r="7"/>
      <ellipse cx="1179" cy="408" rx="3" ry="7"/>
      <line x1="1172" y1="408" x2="1186" y2="408"/>
    </g>

    <!-- Ideas_Attachments (AERO style: semi-transparent) -->
    <g opacity="0.55">
      <use href="#folder" x="756" y="442" fill="#FBF1E1" stroke="#9C6415" stroke-width="1.5"/>
      <text x="786" y="457" font-family="Source Sans 3" font-weight="400" font-size="20" fill="#9C6415">Ideas_Attachments</text>
    </g>

    <!-- Reading list -->
    <use href="#doc" x="756" y="486" fill="#FFFFFF" stroke="#3556A6" stroke-width="1.5"/>
    <path d="M766 486 V492 H772" fill="none" stroke="#3556A6" stroke-width="1.5"/>
    <text x="784" y="503" font-family="Source Sans 3" font-weight="400" font-size="20" fill="#17202C">Reading list</text>
  </g>
</svg>
